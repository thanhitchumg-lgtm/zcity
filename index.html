<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Thành phố của tôi</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#a9c9e2;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
#viewport{position:absolute;inset:0;touch-action:none}
canvas{display:block;touch-action:none}
.panel{background:rgba(16,20,26,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.14);border-radius:12px}
.btn{font:inherit;font-size:13px;color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:9px;padding:8px 12px;cursor:pointer;white-space:nowrap}
.btn:active{background:rgba(255,255,255,.26)}
.btn.primary{background:#2f7d43;border-color:#4e9a5a}
.btn.danger{background:#7a3030;border-color:#9a4040}
.btn[disabled]{opacity:.45;cursor:default}
#topbar{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:8px;align-items:center;z-index:5;flex-wrap:wrap}
#gold{flex:0 0 auto;padding:9px 14px;font-size:15px;font-weight:600;display:flex;align-items:center;gap:7px;font-variant-numeric:tabular-nums}
#gold .ic{width:13px;height:13px;border-radius:50%;background:#f2c94c;box-shadow:inset 0 0 0 2px #c99a1e;display:inline-block}
#topbar .spacer{flex:1}
#btnHarvestAll.panel,#btnCity.panel{background:rgba(16,20,26,.7)}
#btnHarvestAll.on{background:#2f7d43;border-color:#58b06a}
#camCtl{position:absolute;right:10px;top:50%;transform:translateY(-58%);display:flex;flex-direction:column;gap:6px;z-index:5}
#camCtl button{width:40px;height:40px;font-size:18px;line-height:1;padding:0}
#placebar{position:absolute;left:50%;transform:translateX(-50%);top:60px;display:none;align-items:center;gap:8px;padding:8px 10px;font-size:13px;z-index:6;max-width:calc(100% - 24px);box-sizing:border-box}
#placeLabel{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toast{position:absolute;left:50%;transform:translateX(-50%);top:112px;padding:9px 14px;font-size:13.5px;z-index:8;display:none;max-width:calc(100% - 40px);text-align:center}
#hint{position:absolute;left:50%;transform:translateX(-50%);top:60px;padding:8px 12px;font-size:12.5px;z-index:4;line-height:1.5;text-align:center;max-width:calc(100% - 40px);transition:opacity .6s}
#buildbar{position:absolute;left:8px;right:8px;bottom:8px;z-index:5;padding:8px}
#cattabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:8px;padding-bottom:2px}
#cattabs button{flex:0 0 auto}
#cattabs button.active{background:#2e6ddb;border-color:#4f8af0}
#cards{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
#cards,#cattabs{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.35) transparent}
#cards::-webkit-scrollbar,#cattabs::-webkit-scrollbar{height:6px}
#cards::-webkit-scrollbar-thumb,#cattabs::-webkit-scrollbar-thumb{background:rgba(255,255,255,.3);border-radius:3px}
#cards::-webkit-scrollbar-track,#cattabs::-webkit-scrollbar-track{background:transparent}
.card{flex:0 0 142px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:10px;padding:8px;cursor:pointer}
.card.sel{border-color:#4f8af0;background:rgba(79,138,240,.28)}
.card.locked{opacity:.42;cursor:not-allowed}
.card .nm{font-size:12.5px;font-weight:600;margin-bottom:4px}
.card .pr{font-size:12px;color:#f2c94c}
.card .meta{font-size:10.5px;color:#cfd3d8;margin-top:3px}
#modalWrap{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.45);z-index:9}
#modal{width:min(370px,92vw);max-height:80vh;overflow:auto;padding:16px;box-sizing:border-box}
#modal h3{margin:0 0 10px;font-size:16px;font-weight:600}
#modal .row{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.08)}
#modal .row span:last-child{text-align:right;font-variant-numeric:tabular-nums}
#modal .actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
#modal .actions .btn{flex:1}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#a9c9e2;color:#16324a;z-index:20;font-size:15px;text-align:center;padding:24px}
</style>
</head>
<body>
<div id="loading">Đang dựng thành phố…</div>
<div id="viewport"></div>

<div id="topbar">
  <div id="gold" class="panel"><span class="ic"></span><span id="goldVal">0</span></div>
  <button class="btn panel" id="btnHarvestAll" disabled>Thu hoạch tất cả</button>
  <div class="spacer"></div>
  <button class="btn panel" id="btnCity">Thông tin thành phố</button>
</div>

<div id="placebar" class="panel">
  <span id="placeLabel">Đang đặt: …</span>
  <button class="btn" id="btnRotB">Xoay nhà ⟳</button>
  <button class="btn danger" id="btnCancelPlace">Hủy</button>
</div>
<div id="toast" class="panel"></div>
<div id="hint" class="panel">Kéo: di chuyển · Chuột phải kéo / xoay 2 ngón: xoay 360° · Lăn chuột / chụm ngón: thu phóng</div>

<div id="camCtl">
  <button class="btn panel" id="rotL" title="Xoay trái" aria-label="Xoay trái">⟲</button>
  <button class="btn panel" id="rotR" title="Xoay phải" aria-label="Xoay phải">⟳</button>
  <button class="btn panel" id="tilt" title="Đổi góc nghiêng" aria-label="Đổi góc nghiêng">◢</button>
  <button class="btn panel" id="zoomIn" title="Phóng to" aria-label="Phóng to">+</button>
  <button class="btn panel" id="zoomOut" title="Thu nhỏ" aria-label="Thu nhỏ">−</button>
</div>

<div id="buildbar" class="panel">
  <div id="cattabs"></div>
  <div id="cards"></div>
</div>

<div id="modalWrap"><div id="modal" class="panel"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
var loadingEl=document.getElementById('loading');
if(!window.THREE){loadingEl.textContent='Không tải được thư viện 3D. Kiểm tra kết nối mạng rồi tải lại trang.';return;}
var T=THREE,DEG=Math.PI/180,PI=Math.PI;
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
var R=rng(20261111);
function rr(a,b){return a+R()*(b-a);}

/* ============================= DỮ LIỆU GAME ============================= */
var CELL=5,MAX_BUILD=1000,MAX_ROAD=3000,START_GOLD=10000;
var LAND_TIERS=[
  {half:10,cost:0},{half:14,cost:8000},{half:19,cost:18000},{half:25,cost:40000},{half:32,cost:90000},
  {half:40,cost:200000},{half:50,cost:450000},{half:62,cost:1000000},{half:78,cost:2200000}
];
function requiredLandTierForType(tier){return tier===1?0:(tier===2?3:6);}
/* cycle: giây mỗi lượt · gross/upkeep: gold mỗi lượt · upkeepHour: gold mỗi giờ (chỉ trừ khi đang mở game) · ht: chiều cao (m) */
var BUILD_TYPES=[
  {id:'garden',name:'Khu vườn rau',category:'Kinh doanh',tier:1,kind:'income',price:500,cycle:300,gross:70,upkeep:10,fw:2,fd:2,ht:1.4},
  {id:'cafe',name:'Quán cà phê nhỏ',category:'Kinh doanh',tier:1,kind:'income',price:2000,cycle:900,gross:190,upkeep:30,fw:2,fd:3,ht:5.6},
  {id:'store',name:'Cửa hàng tạp hóa',category:'Kinh doanh',tier:1,kind:'income',price:5000,cycle:1800,gross:480,upkeep:70,fw:3,fd:3,ht:5.2},
  {id:'badminton',name:'Sân cầu lông',category:'Thể thao',tier:1,kind:'income',price:1500,cycle:600,gross:130,upkeep:20,fw:2,fd:4,ht:2},
  {id:'house4',name:'Nhà cấp 4 mái Nhật',category:'Nhà ở',tier:1,kind:'passive',price:3500,upkeepHour:15,fw:3,fd:4,ht:6.4},
  {id:'road',name:'Đường',category:'Hạ tầng',tier:1,kind:'road',price:50,fw:1,fd:1,ht:.2},
  {id:'gardenBig',name:'Khu vườn lớn',category:'Kinh doanh',tier:2,kind:'income',price:2500,cycle:600,gross:220,upkeep:35,fw:3,fd:3,ht:3.6},
  {id:'restaurant',name:'Nhà hàng',category:'Kinh doanh',tier:2,kind:'income',price:12000,cycle:3600,gross:1300,upkeep:220,fw:4,fd:5,ht:8},
  {id:'basketball',name:'Sân bóng rổ',category:'Thể thao',tier:2,kind:'income',price:5500,cycle:2400,gross:470,upkeep:85,fw:4,fd:4,ht:4},
  {id:'tennis',name:'Sân tennis',category:'Thể thao',tier:2,kind:'income',price:6000,cycle:2700,gross:520,upkeep:90,fw:3,fd:5,ht:3.4},
  {id:'house3',name:'Nhà 3 tầng',category:'Nhà ở',tier:2,kind:'passive',price:9000,upkeepHour:35,fw:3,fd:3,ht:13},
  {id:'library',name:'Thư viện',category:'Tiện ích',tier:2,kind:'passive',price:7000,upkeepHour:25,fw:4,fd:4,ht:9.4},
  {id:'restaurantP',name:'Nhà hàng cao cấp',category:'Kinh doanh',tier:3,kind:'income',price:45000,cycle:9000,gross:4500,upkeep:950,fw:4,fd:5,ht:10.6},
  {id:'apartment',name:'Chung cư',category:'Nhà ở',tier:3,kind:'passive',price:30000,upkeepHour:110,fw:5,fd:6,ht:19.5},
  {id:'school',name:'Trường học',category:'Tiện ích',tier:3,kind:'passive',price:20000,upkeepHour:70,fw:5,fd:5,ht:9.6},
  {id:'stadium',name:'Sân bóng đá',category:'Thể thao',tier:3,kind:'passive',price:25000,upkeepHour:60,fw:6,fd:10,ht:12}
];
var TYPE_BY_ID={};BUILD_TYPES.forEach(function(t){TYPE_BY_ID[t.id]=t;});
var CATS=['Nhà ở','Kinh doanh','Thể thao','Tiện ích','Hạ tầng'];
function dims(t,rot){return (rot&1)?[t.fd,t.fw]:[t.fw,t.fd];}

/* ============================= RENDERER ============================= */
var mobile=/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)||Math.min(innerWidth,innerHeight)<520;
var viewport=document.getElementById('viewport');
var renderer=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,mobile?1.5:2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputEncoding=T.sRGBEncoding;
renderer.toneMapping=T.ACESFilmicToneMapping;
renderer.toneMappingExposure=.62;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=T.PCFSoftShadowMap;
viewport.appendChild(renderer.domElement);
var ANISO=Math.min(8,renderer.capabilities.getMaxAnisotropy());
var scene=new T.Scene();
scene.fog=new T.Fog(0xc4d9ea,260,1500);
var camera=new T.PerspectiveCamera(45,innerWidth/innerHeight,1,5000);

/* ============================= TEXTURE THỦ TỤC ============================= */
var TS=mobile?256:512;
function mk(s,fn){var c=document.createElement('canvas');c.width=c.height=s;fn(c.getContext('2d'),s);return c;}
function mk2(w,h,fn){var c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);return c;}
function toTex(c,srgb){var t=new T.CanvasTexture(c);t.wrapS=t.wrapT=T.RepeatWrapping;t.anisotropy=ANISO;if(srgb)t.encoding=T.sRGBEncoding;return t;}
function normalFrom(c,k){
  var s=c.width,src=c.getContext('2d').getImageData(0,0,s,s).data;
  var o=document.createElement('canvas');o.width=o.height=s;var g=o.getContext('2d'),im=g.createImageData(s,s),d=im.data;
  function h(x,y){return src[(((y+s)%s)*s+((x+s)%s))*4]/255;}
  for(var y=0;y<s;y++)for(var x=0;x<s;x++){
    var dx=(h(x+1,y)-h(x-1,y))*k,dy=(h(x,y+1)-h(x,y-1))*k,l=1/Math.sqrt(dx*dx+dy*dy+1),i=(y*s+x)*4;
    d[i]=(-dx*l*.5+.5)*255;d[i+1]=(dy*l*.5+.5)*255;d[i+2]=(l*.5+.5)*255;d[i+3]=255;
  }
  g.putImageData(im,0,0);return toTex(o,false);
}
function speck(g,s,seed,n,cols,a,b){var r=rng(seed);n=n*s*s/262144;for(var i=0;i<n;i++){g.fillStyle=cols[(r()*cols.length)|0];var z=a+r()*(b-a);g.fillRect(r()*s,r()*s,z,z);}}
function pair(s,drawC,drawH,k){var c=mk(s,drawC),h=mk(s,drawH);return{map:toTex(c,true),normalMap:normalFrom(h,k)};}
function speckPair(base,cols,n,a,b,k,seed){
  return pair(TS,function(g,s){g.fillStyle=base;g.fillRect(0,0,s,s);speck(g,s,seed,n,cols,a,b);},
    function(g,s){g.fillStyle='#808080';g.fillRect(0,0,s,s);speck(g,s,seed,n,['#b8b8b8','#484848','#d8d8d8','#282828','#989898'].slice(0,cols.length),a,b);},k);
}
var TX={};
TX.asphalt=speckPair('#303134',['#3d3e41','#252628','#4a4b4e','#1c1d1f','#5a5b5e'],26000,1,3,2.2,11);
TX.concrete=speckPair('#b3afa7',['#bdb9b1','#a39f97','#c7c3bb','#97938b','#aeaaa2'],16000,1,4,1.2,12);
TX.stone=speckPair('#77736d',['#85817b','#625f5a','#938f88','#55524d','#6e6a64'],20000,1,5,2.0,13);
TX.grass=speckPair('#4b7433',['#557f38','#3f662b','#63903f','#35592a','#6f9a48'],30000,1,4,2.4,14);
TX.plaster=pair(TS,function(g,s){
  g.fillStyle='#f3f0e9';g.fillRect(0,0,s,s);speck(g,s,15,9000,['#ffffff','#e8e4db','#f0ece3','#e2ddd3'],1,3);
  var r=rng(151);for(var i=0;i<22;i++){var x=r()*s,w=4+r()*18,gr=g.createLinearGradient(0,0,0,s*(.3+r()*.5));gr.addColorStop(0,'rgba(120,115,100,.10)');gr.addColorStop(1,'rgba(120,115,100,0)');g.fillStyle=gr;g.fillRect(x,0,w,s);}
},function(g,s){g.fillStyle='#808080';g.fillRect(0,0,s,s);speck(g,s,15,9000,['#a0a0a0','#606060','#909090','#707070'],1,3);},1.0);
TX.pavers=(function(){
  function draw(h){return function(g,s){
    g.fillStyle=h?'#303030':'#6b675f';g.fillRect(0,0,s,s);
    var r=rng(16),bw=s/4,bh=s/8;
    for(var row=0;row<8;row++)for(var c=-1;c<4;c++){
      var x=c*bw+(row%2?bw/2:0),y=row*bh,v=r();
      if(h){g.fillStyle='rgb('+(190+v*40|0)+','+(190+v*40|0)+','+(190+v*40|0)+')';}
      else{var b=150+v*45|0;g.fillStyle='rgb('+(b+8)+','+(b+2)+','+(b-8)+')';}
      g.fillRect(x+2,y+2,bw-4,bh-4);
    }
    speck(g,s,161,7000,h?['#e0e0e0','#a0a0a0','#c0c0c0']:['rgba(255,255,255,.07)','rgba(0,0,0,.09)','rgba(90,80,60,.08)'],1,3);
  };}
  return pair(TS,draw(false),draw(true),2.4);
})();
TX.roof=(function(){
  function draw(h){return function(g,s){
    var r=rng(18),cw=s/8,rh=s/4;
    for(var row=0;row<4;row++)for(var c=-1;c<8;c++){
      var x=c*cw+(row%2?cw/2:0),y=row*rh,v=r(),hg=g.createLinearGradient(x,0,x+cw,0);
      if(h){hg.addColorStop(0,'#202020');hg.addColorStop(.5,'#ffffff');hg.addColorStop(1,'#202020');}
      else{var b=168+v*50|0;hg.addColorStop(0,'rgb('+(b-70)+','+(b-70)+','+(b-70)+')');hg.addColorStop(.25,'rgb('+b+','+b+','+b+')');hg.addColorStop(.6,'rgb('+(b+18)+','+(b+18)+','+(b+18)+')');hg.addColorStop(1,'rgb('+(b-80)+','+(b-80)+','+(b-80)+')');}
      g.fillStyle=hg;g.fillRect(x,y,cw+1,rh);
      var vg=g.createLinearGradient(0,y,0,y+rh);
      if(h){vg.addColorStop(0,'rgba(0,0,0,.85)');vg.addColorStop(.9,'rgba(0,0,0,0)');}
      else{vg.addColorStop(0,'rgba(0,0,0,.6)');vg.addColorStop(.3,'rgba(0,0,0,.08)');vg.addColorStop(.93,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(255,255,255,.22)');}
      g.fillStyle=vg;g.fillRect(x,y,cw+1,rh);
    }
    if(!h)speck(g,s,181,5000,['rgba(0,0,0,.10)','rgba(255,255,255,.06)','rgba(70,90,50,.10)'],1,4);
  };}
  return pair(TS,draw(false),draw(true),3.2);
})();
TX.wood=(function(){
  function draw(h){return function(g,s){
    g.fillStyle=h?'#808080':'#8a5b38';g.fillRect(0,0,s,s);var r=rng(19);
    for(var i=0;i<260;i++){var x=r()*s,w=1+r()*3,a=.05+r()*.2;g.fillStyle=h?(r()<.5?'rgba(0,0,0,'+a+')':'rgba(255,255,255,'+a+')'):(r()<.6?'rgba(50,25,8,'+a+')':'rgba(210,160,110,'+a*.6+')');g.fillRect(x,0,w,s);}
  };}
  return pair(256,draw(false),draw(true),1.6);
})();
TX.bark=(function(){
  function draw(h){return function(g,s){
    g.fillStyle=h?'#808080':'#5b4a3a';g.fillRect(0,0,s,s);var r=rng(20);
    for(var i=0;i<420;i++){var x=r()*s,y=r()*s,w=1+r()*4,l=20+r()*90,a=.15+r()*.35;g.fillStyle=h?(r()<.55?'rgba(0,0,0,'+a+')':'rgba(255,255,255,'+a+')'):(r()<.6?'rgba(28,20,12,'+a+')':'rgba(150,130,105,'+a*.6+')');g.fillRect(x,y,w,l);}
  };}
  return pair(256,draw(false),draw(true),3.0);
})();
TX.leaf=(function(){
  function draw(h){return function(g,s){
    g.fillStyle=h?'#404040':'#2d5320';g.fillRect(0,0,s,s);var r=rng(21);
    var cols=h?['#e8e8e8','#909090','#c0c0c0','#686868','#ffffff']:['#4c8030','#386625','#5e9438','#2c541f','#74a548'];
    for(var i=0;i<5200*s*s/262144;i++){g.fillStyle=cols[(r()*cols.length)|0];g.beginPath();g.ellipse(r()*s,r()*s,3+r()*6,1.5+r()*3,r()*PI,0,PI*2);g.fill();}
  };}
  var p=pair(TS,draw(false),draw(true),2.6);p.map.repeat.set(4,3);p.normalMap.repeat.set(4,3);return p;
})();
TX.soil=(function(){
  function draw(h){return function(g,s){
    g.fillStyle=h?'#808080':'#5a3f2b';g.fillRect(0,0,s,s);
    for(var i=0;i<4;i++){var y=i*s/4,gr=g.createLinearGradient(0,y,0,y+s/4);
      if(h){gr.addColorStop(0,'#303030');gr.addColorStop(.5,'#e0e0e0');gr.addColorStop(1,'#303030');}
      else{gr.addColorStop(0,'rgba(20,12,6,.55)');gr.addColorStop(.5,'rgba(120,85,55,.35)');gr.addColorStop(1,'rgba(20,12,6,.55)');}
      g.fillStyle=gr;g.fillRect(0,y,s,s/4);}
    speck(g,s,31,9000,h?['#b0b0b0','#505050']:['rgba(0,0,0,.18)','rgba(150,110,75,.25)','rgba(90,60,35,.3)'],1,3);
  };}
  return pair(256,draw(false),draw(true),2.2);
})();
TX.bars=toTex(mk(256,function(g,s){g.clearRect(0,0,s,s);g.fillStyle='#17191c';for(var x=10;x<s;x+=32)g.fillRect(x,0,7,s);g.fillRect(0,18,s,10);g.fillRect(0,s-34,s,10);}),true);
TX.net=toTex(mk(128,function(g,s){g.clearRect(0,0,s,s);g.fillStyle='#f4f4f4';for(var i=0;i<s;i+=16){g.fillRect(i,0,3,s);g.fillRect(0,i,s,3);}}),true);

  try{

    var old=localStorage.getItem(OLD_KEY);

      var o=JSON.parse(old);

        var n=freshState();n.gold=o.gold+5000;n.landTierIndex=o.landTierIndex||0;n.nextId=o.nextId||1;n.totalEarned=o.totalEarned||0;

  if(nPtr===1){drag={btn:e.button,sx:e.clientX,sy:e.clientY,lx:e.clientX,ly:e.clientY,moved:false,mode:(e.pointerType==='mouse'&&e.button!==0)?'rot':'pan',grab:groundPoint(e.clientX,e.clientY)};}
  else if(nPtr===2&&drag){drag.moved=true;drag.mode='gest';var t=two();gest={d:pd(t[0],t[1]),a:Math.atan2(t[1].y-t[0].y,t[1].x-t[0].x),my:(t[0].y+t[1].y)/2};}

  if(ptrs[e.pointerId]){ptrs[e.pointerId].x=e.clientX;ptrs[e.pointerId].y=e.clientY;}
  if(nPtr>=2&&gest){
    var t=two(),nd=pd(t[0],t[1]),na=Math.atan2(t[1].y-t[0].y,t[1].x-t[0].x),nm=(t[0].y+t[1].y)/2,da=na-gest.a;

  }

      }

  }
  if(e.pointerType==='mouse'&&!(drag&&drag.moved)){lastHover=groundPoint(e.clientX,e.clientY);updateGhost(lastHover);}
});

/* thân nhà (hộp bao phần xây dựng, toạ độ cục bộ, mặt tiền +z): [x0,x1,z0,z1,cao] */
var BODY={cafe:[-3.8,3.8,-6.8,-.6,5],store:[-5.5,5.5,-7,.6,4.7],house4:[-4.5,4.5,-4.7,5.3,5.8],house3:[-5.5,1.1,-6.6,3.4,12.5],apartment:[-9,9,-13.5,-1.5,17.5],restaurant:[-7,7,-11.5,1.7,7.5],restaurantP:[-7,7,-11.5,-.5,10],library:[-7,7,-8.5,3.2,8.5],school:[-10.5,10.5,-11.65,-3.4,9]};
function pickBody(r){
  var o=[r.origin.x,r.origin.y,r.origin.z],d=[r.direction.x,r.direction.y,r.direction.z],best=null,bt=1e9;
  Object.keys(state.buildings).forEach(function(id){
    var b=state.buildings[id],bd=BODY[b.typeId];if(!bd)return;
    var c=bCenter(b,TYPE_BY_ID[b.typeId]),k=(b.rot||0)&3,x0=bd[0],x1=bd[1],z0=bd[2],z1=bd[3],mn,mx;
    if(k===0){mn=[x0,0,z0];mx=[x1,bd[4],z1];}else if(k===1){mn=[z0,0,-x1];mx=[z1,bd[4],-x0];}else if(k===2){mn=[-x1,0,-z1];mx=[-x0,bd[4],-z0];}else{mn=[-z1,0,x0];mx=[-z0,bd[4],x1];}
    mn[0]+=c[0];mx[0]+=c[0];mn[2]+=c[1];mx[2]+=c[1];
    var t0=0,t1=1e9;
    for(var a=0;a<3;a++){
      if(Math.abs(d[a])<1e-9){if(o[a]<mn[a]||o[a]>mx[a])return;}
      else{var ta=(mn[a]-o[a])/d[a],tb=(mx[a]-o[a])/d[a];if(ta>tb){var s=ta;ta=tb;tb=s;}if(ta>t0)t0=ta;if(tb<t1)t1=tb;if(t0>t1)return;}
    }
    if(t0<bt){bt=t0;best=id;}
  });
  return best?{id:best,t:bt}:null;
}
function handleClick(cx,cy,ptype){
  var p=groundPoint(cx,cy);
  if(placing){if(p){var o=placeOrigin(p,placing,placeRot);tryPlace(placing,o.gx,o.gz,placeRot);if(ptype==='mouse'){lastHover=p;updateGhost(p);}}return;}
  var r=setRay(cx,cy),hit=pickBody(r),tg=p?p.distanceTo(r.origin):1e9,id;
  if(hit&&hit.t<tg)id=hit.id;
  else if(p){var k=Math.floor(p.x/CELL)+','+Math.floor(p.z/CELL);id=occ[k]!==undefined?occ[k]:roadCells[k];}
  if(id===undefined||!state.buildings[id])return;
  var b=state.buildings[id],t=TYPE_BY_ID[b.typeId];
  if(t.kind==='income'&&connOf[id]&&isReady(b,t))harvestBuilding(id);else openBuildingInfo(id);
}

function afterChange(roadChanged){recomputeConn();if(roadChanged){rebuildRoads();syncAgents();}refreshMarks();updateGoldUI();saveState();}
function tryPlace(t,gx,gz,rot){
  if(!requiredTierUnlocked(t))return false;
  if(state.gold<t.price){toast('Không đủ gold');return false;}
  if(t.kind==='road'){if(nRoad>=MAX_ROAD){toast('Đã đạt giới hạn số ô đường');return false;}}
  else if(nBuild>=MAX_BUILD){toast('Thành phố đã đạt tối đa '+MAX_BUILD+' công trình');return false;}
  if(!footprintFree(t,gx,gz,rot)){toast('Vị trí không hợp lệ');return false;}
  state.gold-=t.price;
  var id=String(state.nextId++),b={typeId:t.id,gx:gx,gz:gz,rot:t.kind==='road'?0:rot,acc:0};state.buildings[id]=b;
  if(t.kind==='road'){roadCells[gx+','+gz]=id;nRoad++;}
  else{eachCell(b,t,function(k){occ[k]=id;});nBuild++;addInstance(id);}
  afterChange(t.kind==='road');
  if(t.kind!=='road'&&!connOf[id])toast('Chưa nối đường — hãy xây đường sát bên để công trình hoạt động');
  return true;
}
function sellBuilding(id){
  var b=state.buildings[id];if(!b)return;var t=TYPE_BY_ID[b.typeId];
  state.gold+=Math.round(t.price*.5);
  if(t.kind==='road'){delete roadCells[b.gx+','+b.gz];nRoad--;}
  else{eachCell(b,t,function(k){delete occ[k];});nBuild--;}
  delete state.buildings[id];
  if(t.kind!=='road')removeInstance(id,t.id);
  closeModal();afterChange(t.kind==='road');
}
function harvestBuilding(id,silent){
  var b=state.buildings[id];if(!b)return 0;var t=TYPE_BY_ID[b.typeId];
  if(!isReady(b,t)||!connOf[id])return 0;
  var net=netOf(t);state.gold+=net;state.totalEarned+=net;b.acc=0;
  if(!silent){closeModal();refreshMarks();updateGoldUI();saveState();toast('+'+fmt(net)+' gold · '+t.name);}
  return net;
}

var firstTick=true,lastPerf=performance.now(),markTimer=0,animT=0;
function economy(){
  var now=Date.now(),elMs=now-state.lastSeen;if(elMs<0)elMs=0;state.lastSeen=now;
  var live=Math.min(elMs,1000),visible=document.visibilityState==='visible',drain=0;
  Object.keys(state.buildings).forEach(function(id){
    var b=state.buildings[id],t=TYPE_BY_ID[b.typeId];if(t.kind==='road'||!connOf[id])return;
    if(t.kind==='income'){var cap=t.cycle*1000;if(b.acc<cap)b.acc=Math.min(cap,(b.acc||0)+elMs);}
    else if(visible)drain+=t.upkeepHour/3600000*live;
  });
  if(drain>0)state.gold=Math.max(0,state.gold-drain);
  return elMs;
}
function tick(pnow){
  requestAnimationFrame(tick);
  var dt=Math.min((pnow-lastPerf)/1000,.1);lastPerf=pnow;animT+=dt;
  var away=economy();
  markTimer-=dt;
  if(firstTick||markTimer<=0||away>5000){
    markTimer=.5;refreshMarks();updateGoldUI();
    if(modalFor&&state.buildings[modalFor]){var st=document.getElementById('mStatus');if(st){st.textContent=statusText(modalFor);var hb=document.getElementById('mHarvest'),bb=state.buildings[modalFor];if(hb)hb.disabled=!(connOf[modalFor]&&isReady(bb,TYPE_BY_ID[bb.typeId]));}}
  }
  if((firstTick&&away>60000)||(!firstTick&&away>60000)){if(readyIds.length)toast('Bạn vắng '+fmtTime(away/1000).trim()+' — có '+readyIds.length+' công trình chờ thu hoạch');}
  if(yawGoal!==null){var dy=yawGoal-camYaw;if(Math.abs(dy)<.004){camYaw=yawGoal;yawGoal=null;}else camYaw+=dy*Math.min(1,dt*9);updateCamera();}
  if(pitchGoal!==null){var dp=pitchGoal-camPitch;if(Math.abs(dp)<.004){camPitch=pitchGoal;pitchGoal=null;}else camPitch+=dp*Math.min(1,dt*9);updateCamera();}
  updateAgents(dt);drawMarks(animT);clouds.rotation.y=animT*.003;
  renderer.render(scene,camera);
  if(firstTick){firstTick=false;loadingEl.style.display='none';setTimeout(function(){var h=document.getElementById('hint');h.style.opacity='0';setTimeout(function(){h.style.display='none';},700);},9000);}
}

/* ============================= KHỞI ĐỘNG ============================= */
Object.keys(state.buildings).forEach(function(id){if(TYPE_BY_ID[state.buildings[id].typeId].kind!=='road')addInstance(id);});
recomputeConn();rebuildLand();rebuildRoads();syncAgents();updateCamera();
renderCatTabs();renderCards();updateGoldUI();
setInterval(saveState,5000);
document.addEventListener('visibilitychange',function(){if(document.hidden)saveState();});
window.addEventListener('pagehide',saveState);window.addEventListener('beforeunload',saveState);
window.__city={state:state,tryPlace:tryPlace,TYPE_BY_ID:TYPE_BY_ID,harvestAll:harvestAll,cam:function(y,p,d,x,z){if(y!==undefined)camYaw=y;if(p!==undefined)camPitch=p;if(d!==undefined)camDist=d;if(x!==undefined)camTarget.x=x;if(z!==undefined)camTarget.z=z;updateCamera();},stats:function(){var o={};Object.keys(BAKED).forEach(function(k){o[k]=BAKED[k].tris;});o.draw=renderer.info.render.calls;o.tri=renderer.info.render.triangles;return o;},refresh:refreshMarks,conn:function(id){return connOf[id];},view:function(){return[camYaw,camPitch,camDist,camTarget.x,camTarget.z,placeRot,readyIds.length,warnIds.length];},dbg:{renderer:renderer,scene:scene,sun:sun,hemi:hemi,MC:MC,sky:sky,sunDir:sunDir}};
requestAnimationFrame(tick);
})();
</script>
